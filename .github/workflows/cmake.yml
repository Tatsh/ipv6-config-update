---
jobs:
  build-linux:
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules libsystemd-dev qt6-base-dev
      - name: Configure
        run: >-
          cmake -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -B ${{github.workspace}}/build
          --install-prefix ${{github.workspace}}/build/AppDir/usr
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build --verbose --config ${{matrix.build-type}}
      - name: Install
        run: cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      - env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
        name: Create AppImage
        run: |
          wget "https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-${DEPLOY_ARCH}.AppImage"
          chmod +x "linuxdeploy-${DEPLOY_ARCH}.AppImage"
          mkdir -p ${{github.workspace}}/build/AppDir/usr/share/icons/hicolor/scalable/apps
          wget 'https://raw.githubusercontent.com/GNOME/adwaita-icon-theme/refs/heads/master/src/fullcolor/application-x-generic.source.svg' -O ${{github.workspace}}/build/AppDir/usr/share/icons/hicolor/scalable/apps/application-x-generic.svg
          cat > ${{github.workspace}}/build/ipv6-config-update.desktop <<EOF
          [Desktop Entry]
          Categories=Utility;
          Exec=ipv6-config-update %u
          Icon=application-x-generic
          Name=ipv6-config-update
          NoDisplay=true
          Type=Application
          Version=1.5
          EOF
          "./linuxdeploy-${DEPLOY_ARCH}.AppImage" --appdir ${{github.workspace}}/build/AppDir --output appimage --desktop-file ${{github.workspace}}/build/ipv6-config-update.desktop
          rm "./linuxdeploy-${DEPLOY_ARCH}.AppImage"
          mv -v ${{github.workspace}}/*.AppImage "${{github.workspace}}/ipv6-config-update-${{matrix.build-type}}-${DEPLOY_ARCH}.AppImage"
      - env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Rename with tag
        run: >-
          mv -v "${GITHUB_WORKSPACE}"/ipv6-config-update-*.AppImage
          "${GITHUB_WORKSPACE}/ipv6-config-update-${TAG}-${DEPLOY_ARCH}.AppImage"
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: ipv6-config-update-${{ matrix.build-type }}-Linux-${{ matrix.arch.deploy_arch }}
          path: |
            ${{github.workspace}}/ipv6-config-update-*.AppImage
            ${{github.workspace}}/ipv6-config-update-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/ipv6-config-update-*.AppImage
            ${{github.workspace}}/ipv6-config-update-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package to draft release
        run: |
          shopt -s nullglob
          files=("${GITHUB_WORKSPACE}"/ipv6-config-update-*.AppImage)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No AppImage was produced; refusing to attach an empty asset set.'
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              break
            fi
            # A sibling matrix job may win this race, which is fine: only existence matters.
            if gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$TAG" \
              --notes ''; then
              break
            fi
            echo "Draft release ${TAG} is not available yet (attempt ${attempt})."
            sleep 5
          done
          gh release view "$TAG" --repo "$REPO" >/dev/null
          gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          mapfile -t attached < <(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | select(.state == "uploaded") | .name')
          for file in "${files[@]}"; do
            name=$(basename "$file")
            if ! printf '%s\n' "${attached[@]}" | grep -qxF "$name"; then
              echo "::error::Asset '${name}' is missing or incomplete after upload."
              exit 1
            fi
            echo "Attached ${name} to ${TAG}."
          done
    strategy:
      fail-fast: false
      matrix:
        arch:
          - deploy_arch: aarch64
            runner: ubuntu-24.04-arm
          - deploy_arch: x86_64
            runner: ubuntu-latest
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  attestations: write
  contents: write
  id-token: write
